<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Decomposer</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1e293b;background:#f5f7fa}body{max-width:850px;margin:7vh auto;padding:24px}main{background:white;padding:clamp(24px,5vw,48px);border:1px solid #e2e8f0;border-radius:20px}h1{font-size:36px;letter-spacing:-1px;margin:0}p{line-height:1.7;color:#526176}label{display:block;margin:24px 0 8px}input{font:inherit;max-width:100%;box-sizing:border-box}input[type=password]{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px}button,a.download{display:inline-block;background:#2563eb;color:white;padding:12px 22px;border:0;border-radius:9px;font:inherit;cursor:pointer;text-decoration:none;margin-top:24px}button:disabled{opacity:.5;cursor:wait}#status{white-space:pre-wrap;margin-top:24px;line-height:1.6}#preview{max-width:100%;border:1px solid #e2e8f0;border-radius:10px;margin-top:24px}[hidden]{display:none!important}.small{font-size:13px}
</style></head>
<body><main><h1>Decomposer</h1><p>将科研图重建为可编辑的 PowerPoint。上传图片，转换完成后下载 PPTX。</p>
<form id="form"><label for="image">选择图片</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/tiff,image/bmp" required><p class="small">最大 20 MiB、2500 万像素。复杂图片可能需要数分钟。</p><details><summary>访问令牌（服务设置了令牌时填写）</summary><input id="token" type="password" autocomplete="off" placeholder="访问令牌"></details><button id="submit" type="submit">开始转换</button></form>
<div id="status" role="status" aria-live="polite"></div><a id="download" class="download" hidden>下载可编辑 PPTX</a><img id="preview" alt="转换结果预览" hidden></main>
<script>
const form=document.querySelector('#form'),statusBox=document.querySelector('#status'),button=document.querySelector('#submit'),preview=document.querySelector('#preview'),download=document.querySelector('#download');let urls=[];
function headers(){const value=document.querySelector('#token').value;return value?{Authorization:'Bearer '+value}:{};}
async function api(url,options={}){const r=await fetch(url,{...options,headers:headers()});if(!r.ok){let message;try{message=(await r.json()).detail;}catch{message='请求失败：'+r.status;}throw Error(typeof message==='string'?message:JSON.stringify(message));}return r;}
const phases={preprocessing:'识别图片与文字',recognition:'分析图中对象',asset_policy:'准备素材',representation:'重建可编辑对象',composition_compile:'编译与渲染',text_calibration:'校准文字',refinement:'检查并修复细节',refinement_exception:'修复细节',validation:'验证结果'};
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;download.hidden=preview.hidden=true;urls.forEach(URL.revokeObjectURL);urls=[];try{const file=document.querySelector('#image').files[0];if(file.size>20*1024*1024)throw Error('图片不能超过 20 MiB');const data=new FormData();data.append('file',file);statusBox.textContent='正在上传…';const job=await(await api('/api/jobs',{method:'POST',body:data})).json();localStorage.setItem('decomposer-job',job.id);await follow(job.id);}catch(error){statusBox.textContent=error.message;}finally{button.disabled=false;}});
async function follow(id){for(;;){const s=await(await api('/api/jobs/'+id)).json();statusBox.textContent=s.state==='queued'?'排队中…':(phases[s.phase]||'正在转换')+'…';if(s.state==='failed')throw Error('转换失败：'+s.error);if(s.state==='complete'){statusBox.textContent='转换完成。'+(s.validation_passed===false?' 部分视觉指标未达标，请检查预览。':'');const pptx=URL.createObjectURL(await(await api('/api/jobs/'+id+'/pptx')).blob());urls.push(pptx);download.href=pptx;download.download='decomposer.pptx';download.hidden=false;try{const pic=URL.createObjectURL(await(await api('/api/jobs/'+id+'/preview')).blob());urls.push(pic);preview.src=pic;preview.hidden=false;}catch{}return;}await new Promise(r=>setTimeout(r,2000));}}
const previous=localStorage.getItem('decomposer-job');if(previous){statusBox.textContent='上次的任务可以继续查看。';const resume=document.createElement('button');resume.textContent='查看上次结果';resume.onclick=async()=>{resume.remove();button.disabled=true;try{await follow(previous);}catch(e){statusBox.textContent=e.message;}finally{button.disabled=false;}};statusBox.append(document.createElement('br'),resume);}
</script></body></html>
