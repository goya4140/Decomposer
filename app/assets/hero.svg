<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="title desc">
<title id="title">Decomposer — scientific figures, ready to edit.</title><desc id="desc">A scientific figure becomes independently selectable text, shapes and connections.</desc>
