name: Deployment check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build deployment image
        run: docker build -t decomposer:test .
      - name: Check runtime and conversion
        run: |
          docker run --rm --user root \
            -v "$PWD/tests:/app/tests:ro" \
            --entrypoint sh decomposer:test \
            -c 'pip install -r requirements-dev.txt && python -m pytest -q'
      - name: Check Compose definition
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Start through one-command deployment
        run: |
          ./deploy.sh --docker
          curl --fail http://127.0.0.1:7860/healthz
          curl --fail http://127.0.0.1:7860/ > /dev/null
      - name: Container startup diagnostics
        if: always()
        run: |
          docker compose logs --tail 80
          docker compose down -v
